/* ================= PHASE 11.2 — PRELOADER BOOT SEQUENCE =================
   Nothing simulates until every config is fetched+validated and every
   generated asset (atlases, stage, audio buffers) is built. The progress
   bar is weighted so it reflects real work, not file count.            */
async function boot(){
  const bar   = document.getElementById('loadBar');
  const label = document.getElementById('loadLabel');
  const setP = (p,msg)=>{
    if(p!=null) bar.style.transform = 'scaleX('+p+')';
    if(msg) label.textContent = String(msg).toUpperCase();
  };
  try{
    const loader = new AssetLoader({ base:'' }).onProgress(setP);
    await loader.loadManifest('data/manifest.json');
    await loader.loadData();

    // Phase 12: refuse to run obviously tampered balance data
    const audit = auditFighterConfig(loader.assets.fighter);
    if(!audit.ok){
      throw new Error('fighter config failed integrity audit:\n'+audit.violations.join('\n'));
    }
    CONFIG_FINGERPRINT = configFingerprint(loader.assets.fighter);

    /* ---- Phase 16: OTA balance patch, pinned for this session ----
       Fetched once at boot. If the balance server is unreachable we fall
       back to cache and then to the bundled build — a config outage must
       never stop someone playing. The version is pinned for the whole
       session because applying a patch mid-match would desync the peers. */
    LIVE = new LiveConfig({
      fetchJSON: async (u)=>{ const r=await fetch(u,{cache:'no-store'});
        if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); },
      baseConfig: loader.assets.fighter,
      endpoint: '/api/config',
      validate: validateFighter,
      audit: auditFighterConfig,
      fingerprint: configFingerprint,
      storage: (()=>{ try{ localStorage.getItem('x'); return localStorage; }catch{ return null; } })(),
    });
    const boot = await LIVE.bootstrap(PLAYER_ID);
    CONFIG_VERSION = boot.version;
    setP(null, 'config ' + boot.version);

    applyStage(loader.assets.stage);
    applyConfig(LIVE.active, loader.assets.rules, loader.assets.stage);
    CONFIG_FINGERPRINT = LIVE.fingerprint || CONFIG_FINGERPRINT;
    resize();

    /* ---- Phase 15: telemetry (batched, sampled, off the hot path) ---- */
    TEL = new Telemetry({
      transport: async (batch,{beacon}={})=>{
        const body = JSON.stringify(batch);
        if(beacon && navigator.sendBeacon){
          navigator.sendBeacon('/api/telemetry', new Blob([body],{type:'application/json'}));
          return;
        }
        await fetch('/api/telemetry',{method:'POST',headers:{'content-type':'application/json'},
          body, keepalive:true});
      },
      flushMs: 15000, sampleRate: 0.1,
    });
    TEL.identify(PLAYER_ID, { configVersion: CONFIG_VERSION });
    TEL.start();
    TEL.step(FUNNEL.APP_OPEN);
    TEL.step(FUNNEL.ASSETS_LOADED);
    addEventListener('pagehide', ()=>TEL.endSession('pagehide'));
    addEventListener('visibilitychange', ()=>{
      if(document.visibilityState==='hidden') TEL.flush({beacon:true});
    });

    await loader.runStep('atlas.p1', ()=>{ packAtlas(); return true; });
    await loader.runStep('atlas.p2', ()=>true);          // both palettes in one atlas
    await loader.runStep('stage.bg', ()=>{ buildBackground(); return true; });
    await loader.runStep('audio.sfx',()=>true);          // buffers render on user gesture
    await loader.runStep('audio.bgm',()=>true);

    Sim.init(); Cam.reset(); cachePadRects(); UI.sync(); syncToggles();

    /* Module scope keeps the engine off `window` by default. Expose a single
       explicit debug namespace so devtools (and the automated browser tests)
       can inspect state. Read-only inspection only — every value here is
       still covered by the Phase 12 state hash, so poking it desyncs and
       voids the match rather than granting an advantage. */
    window.NEON = {
      Game, P1, P2, MOVES, PHYS, MOTIONS, SCALING, HURT, RULES, STAGE,
      Atlas, FX, Cam, Sim, Net, DEBUG, Projectiles,
      hashGameState, configFingerprint, auditFighterConfig,
      get fingerprint(){ return CONFIG_FINGERPRINT; },
      get bufferLen(){ return BUFFER_LEN; },
      get inputDelay(){ return INPUT_DELAY; },
      get world(){ return {VW,VH,FLOOR,WALL_L,WALL_R}; },
      get live(){ return LIVE; },
      get telemetry(){ return TEL; },
      get configVersion(){ return CONFIG_VERSION; },
    };
    document.getElementById('loading').classList.add('done');
    requestAnimationFrame(frame);

    // Auto-início de combate autônomo para a NgolaBiz Arena
    function autoStartArenaMatch() {
      const bEl = document.getElementById('boot');
      if (bEl) bEl.remove();
      try { Audio5.init(); Audio5.resume(); } catch(e) {}
      if ('ontouchstart' in window) touchRoot.classList.add('on');
      cachePadRects();
      Game.cpu = true; // BOT / CPU SEMPRE ATIVADO PARA LUTAR!
      syncToggles();
      UI.sync();
      startMatch();
    }

    if (window.parent && window.parent !== window) {
      // Sincronização oficial da Arena: NÃO iniciar antes da confirmação de ambos os combatentes!
      let matchAlreadyStarted = false;
      function onArenaStartMessage(ev) {
        if (ev && ev.data && ev.data.type === 'arena_start_match') {
          if (!matchAlreadyStarted) {
            matchAlreadyStarted = true;
            autoStartArenaMatch();
          }
        }
      }
      window.addEventListener('message', onArenaStartMessage);

      // Suporte aos Controles Touch Virtuais da Arena
      window.addEventListener('message', function(ev) {
        if (!ev || !ev.data) return;
        if (ev.data.type === 'arena_key_event' || ev.data.type === 'arena_virtual_key' || ev.data.type === 'virtual_key') {
          var isDown = (ev.data.action === 'down' || ev.data.evType === 'keydown');
          var code = ev.data.code || '';
          if (typeof KEYMAP !== 'undefined') {
            for (var p = 0; p <= 1; p++) {
              if (KEYMAP[p] && KEYMAP[p][code]) {
                var b = KEYMAP[p][code];
                if (isDown) { LiveInput[p] |= b; } else { LiveInput[p] &= ~b; }
              }
            }
          }
        }
      });
    }
  }catch(err){
    document.getElementById('loading').innerHTML =
      '<div style="max-width:80vw;text-align:center">' +
      '<h2 style="color:#ff5a7a;letter-spacing:.1em">FAILED TO LOAD</h2>' +
      '<pre style="white-space:pre-wrap;color:#cfc4ee;font-size:12px;text-align:left">'+
      String(err.message).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))+'</pre>'+
      '<p style="opacity:.6;font-size:12px">Serve over http:// — file:// blocks fetch().</p></div>';
    console.error(err);
  }
}
boot();

/* ---------------- PWA registration (Phase 14) ---------------- */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW failed:',e.message));
  });
}
